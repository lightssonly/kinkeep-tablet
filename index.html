<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>KinKeep Family Tablet</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#48385c;background:#ddd2ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#eadffb,#d7ecfa 62%,#fce5ed)}button{font:inherit;cursor:pointer}#app{min-height:100vh;max-width:800px;margin:auto;padding:22px 18px 28px}.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#655677}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:20px 0}.brand .logo{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:white;box-shadow:0 5px 20px #a698bd55}.hero{text-align:center;padding:22px 8px 25px}.clock{font-size:clamp(48px,10vw,78px);font-weight:300;letter-spacing:-3px;line-height:1.1}.date{font-size:15px;margin-top:6px}.weather{display:inline-flex;margin-top:14px;padding:9px 16px;border-radius:22px;background:#ffffff9c;font-size:13px}.sectiontitle{font-weight:800;margin:18px 0 14px;font-size:15px}.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px 12px}.appbutton{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:#48385c;font-size:13px}.appicon{width:min(100%,92px);aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:36px;box-shadow:0 8px 18px #83749927;border:1px solid #ffffffb0}.reminder,.panel{background:#ffffffc9;border:1px solid white;border-radius:20px;padding:18px;margin-top:22px;box-shadow:0 8px 25px #8e7f9a15}.reminder b{display:block;margin-bottom:7px}.muted{color:#796e86;font-size:13px;line-height:1.5}.nav{display:flex;gap:9px;align-items:center;margin:16px 0 25px}.nav button,.pill,.action{border:0;background:white;color:#58466c;border-radius:13px;padding:10px 14px;font-weight:700}.nav h1{font-size:21px;margin:0 0 0 4px}.family{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.person{border:0;text-align:left;border-radius:21px;padding:18px 13px;min-height:148px;color:#4a3d5d}.person .avatar{display:grid;place-items:center;background:#ffffff9c;border-radius:50%;width:48px;height:48px;font-size:25px;margin-bottom:12px}.person b{display:block;font-size:16px}.person small{display:block;margin-top:5px;color:#6b5d7b}.p0{background:#f6dce9}.p1{background:#d9e9ff}.p2{background:#d9f1e4}.p3{background:#fff0cd}.stats{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:16px 0 9px}.progress{height:10px;background:#e9e3ee;border-radius:15px;overflow:hidden}.fill{height:100%;background:#9b7fc7;border-radius:15px}.task{background:white;border-radius:17px;padding:14px;margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:12px}.task b{font-size:14px}.task small{display:block;color:#85768f;margin-top:6px}.task button{border:0;border-radius:11px;background:#ede4fb;color:#604b79;padding:10px;font-size:12px;font-weight:700;white-space:nowrap}.task button:disabled{opacity:.65;cursor:default}.notice{margin-top:20px;font-size:12px;color:#766987;line-height:1.6}.footer{text-align:center;font-size:11px;color:#8a7d99;margin:30px 0 0}.pill{font-size:12px}.off{background:#17131e!important;color:#fff!important;display:flex;justify-content:center;align-items:center;text-align:center;min-height:100vh!important}.off button{padding:20px 26px;border-radius:18px;border:1px solid #6f617e;background:#292334;color:white;font-weight:bold}.headrow{display:flex;justify-content:space-between;align-items:center}.headrow button{background:#ffffffab;border:0;border-radius:12px;padding:9px 12px;color:#594770}.help{font-size:13px;line-height:1.6}.help li{margin-bottom:9px}@media(min-width:600px){#app{padding:28px 45px}.apps{gap:25px}.appicon{width:100px}.family{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main id="app"></main><script>
const people=[{name:'Mom',role:'Parent',emoji:'👩🏽',tasks:['Plan family dinner','Organize family calendar','Check household supplies']},{name:'Dad',role:'Parent',emoji:'👨🏽',tasks:['Take out recycling','Check the garden','Organize the garage']},{name:'Youth',role:'Youth',emoji:'🧒🏽',tasks:['Make the bed','Tidy toys','Put clothes away']},{name:'Teen',role:'Teen',emoji:'🧑🏽',tasks:['Clean bedroom','Wash dishes','Finish laundry']}];
let page='home',chosen=0,powered=true;const app=document.getElementById('app');
function fmtDate(){return new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',weekday:'long',month:'long',day:'numeric'}).format(new Date())}function fmtTime(){return new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'}).format(new Date())}
function top(){return `<div class="status"><span>KinKeep ✦ Family Tablet</span><span id="smallclock">${fmtTime()} SLT</span></div>`}
function nav(title){return `<div class="nav"><button onclick="go('${page==='list'?'family':'home'}')">← Back</button><button onclick="go('home')">⌂ Home</button><h1>${title}</h1></div>`}
function go(p){page=p;render()}function openPerson(i){chosen=i;go('list')}function power(){powered=!powered;render()}
function getDone(i,j){return sessionStorage.getItem('kinkeep-demo-'+i+'-'+j)==='1'}function toggle(i,j){sessionStorage.setItem('kinkeep-demo-'+i+'-'+j,getDone(i,j)?'0':'1');render()}
function appButton(label,icon,color,p){return `<button class="appbutton" onclick="go('${p}')"><span class="appicon" style="background:${color}">${icon}</span><span>${label}</span></button>`}
function render(){document.body.className=powered?'':'off';if(!powered){app.innerHTML='<button onclick="power()">◉<br><br>KinKeep is sleeping<br><small>Tap to wake tablet</small></button>';return}
let html=top();if(page==='home'){html+=`<div class="headrow"><div class="brand"><span class="logo">💜</span>KinKeep</div><button onclick="power()" aria-label="Sleep tablet">⏻ Sleep</button></div><div class="hero"><div class="clock" id="clock">${fmtTime()}</div><div class="date" id="date">${fmtDate()} · Second Life Time</div><div class="weather">☁️ SL weather: not connected</div></div><div class="sectiontitle">Your Apps</div><div class="apps">${appButton('Chores','📝','#cde4ff','family')}${appButton('Family','👨‍👩‍👧‍👦','#f8d5e7','family')}${appButton('Calendar','📅','#d9f0de','placeholder')}${appButton('Photos','🖼️','#ffe9c8','placeholder')}${appButton('Notes','📒','#e4d7ff','placeholder')}${appButton('Settings','⚙️','#e0e5ef','settings')}</div><div class="reminder"><b>💌 Family Reminder</b><div class="muted">Little things make a happy home. Check today's chores!</div></div>`}
else if(page==='family'){html+=nav('Family Chores')+'<p class="muted">Choose a family member to see their chore list.</p><div class="family">'+people.map((p,i)=>`<button class="person p${i}" onclick="openPerson(${i})"><span class="avatar">${p.emoji}</span><b>${p.name}</b><small>${p.role} · View chores →</small></button>`).join('')+'</div><p class="notice">Demo profiles. Household registration and secure parent permissions will be added in a later version.</p>'}
else if(page==='list'){let p=people[chosen],done=p.tasks.filter((_,j)=>getDone(chosen,j)).length;html+=nav(p.name+'’s Chores')+`<div class="panel"><b>${p.emoji} ${p.name} · ${p.role}</b><div class="stats"><span>${done} of ${p.tasks.length} chores complete</span><b>${done*10} points</b></div><div class="progress"><div class="fill" style="width:${100*done/p.tasks.length}%"></div></div></div><div class="sectiontitle">Today's Chores</div>`+p.tasks.map((t,j)=>`<div class="task"><div><b>${getDone(chosen,j)?'✅':'⬜'} ${t}</b><small>${getDone(chosen,j)?'Demo completed':'Not started'} · 10 points</small></div><button onclick="toggle(${chosen},${j})">${getDone(chosen,j)?'Undo':'Mark done'}</button></div>`).join('')+'<p class="notice">Prototype only: any visitor can tap these buttons. Completion is saved only for this browser session, not submitted to a parent. We will add UUID-based access control and approval before real use.</p>'}
else if(page==='settings'){html+=nav('Settings')+'<div class="panel"><b>KinKeep Prototype v0.1</b><p class="muted">Display timezone: Second Life Time (America/Los_Angeles). Weather integration: not connected. Parent controls: not yet enabled.</p><button class="pill" onclick="power()">⏻ Sleep tablet</button></div>'}
else{html+=nav('Coming Soon')+'<div class="panel"><b>✨ App coming soon</b><p class="muted">This app is decorative in the first KinKeep prototype. The Chores and Family apps are interactive.</p></div>'}
app.innerHTML=html+'<div class="footer">KinKeep · Made for Second Life families · Prototype v0.1</div>'}
render();setInterval(()=>{if(powered){const c=document.getElementById('clock'),d=document.getElementById('date'),s=document.getElementById('smallclock');if(c)c.textContent=fmtTime();if(d)d.textContent=fmtDate()+' · Second Life Time';if(s)s.textContent=fmtTime()+' SLT'}},15000);
</script></body></html>
