<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KinKeep • Family Tablet v0.4</title>
<style>
:root{--accent:#8065bb;--ink:#302b42;--card:#ffffffed;--bg:#f5efff;--wall:none}*{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,sans-serif;color:var(--ink);background:#ded9e8}.tablet{max-width:530px;min-height:100vh;margin:auto;background:linear-gradient(#ffffff55,#ffffff66),var(--wall),var(--bg);background-size:cover;background-position:center;box-shadow:0 0 35px #0002;padding:18px}.top,.line,.nav{display:flex;justify-content:space-between;align-items:center;gap:9px}.top{font-weight:750}.tag{font-size:11px;color:#555}.card{background:var(--card);border:1px solid #ffffffb5;border-radius:19px;padding:16px;margin:12px 0;box-shadow:0 5px 15px #0000000c}.hero{background:linear-gradient(120deg,var(--accent),#3d526b);color:white}.hero h1{font-size:42px;margin:4px 0}.hero small{color:#f7f7ff}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:var(--accent);color:white;border-radius:12px;padding:11px 13px}button.secondary{background:#ffffff;color:var(--ink);border:1px solid #d7d2e0}button.danger{background:#a94e63}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.apps button{background:var(--card);color:var(--ink);padding:14px 4px;min-height:86px}.apps span{display:block;font-size:28px}.profiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.profile{background:var(--card);border:1px solid #ddd4ea;border-radius:14px;text-align:center;padding:8px 2px;min-width:0}.profile b{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis}.profile .emoji{font-size:27px}h2{margin:10px 0}h3{margin:6px 0}p{line-height:1.4}.muted{color:#696477;font-size:12px}.stack{display:grid;gap:10px}label{display:grid;gap:4px;font-weight:600;font-size:13px}input,select,textarea{width:100%;border:1px solid #c9c1d4;border-radius:10px;padding:10px;background:#fff;color:#282236}textarea{min-height:70px}input[type=checkbox]{width:auto}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.small{padding:7px 9px;font-size:12px}.pill{border-radius:100px;background:#eee7f9;padding:4px 8px;font-size:11px}.emojiPick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.emojiPick button{padding:7px 0;background:#fff;font-size:22px;border:1px solid #ddd}.wallgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.wall{height:95px;border:2px solid white;box-shadow:0 2px 7px #0002;display:flex;align-items:end;justify-content:center;font-weight:bold}.notice{font-size:12px;background:#fff8db;padding:10px;border-radius:10px}.nav{margin:10px 0}.hide{display:none}hr{border:0;border-top:1px solid #e4ddeb}button:focus-visible{outline:3px solid #111} @media(max-width:390px){.tablet{padding:11px}.profiles .emoji{font-size:21px}.grid{gap:5px}}
</style></head><body><main class="tablet"><header class="top"><span>✿ KinKeep <span class="tag">v0.4 demo</span></span><span id="headerTime">SLT</span></header><div id="app"><section class="card hero"><div>Welcome home ✨</div><h1>KinKeep</h1><small>Family chores, made cozy.</small></section><section class="card"><h3>Our family</h3><p>Loading the family tablet…</p></section></div></main>
<script>
"use strict";
const KEY="kinkeep-v04-demo";
const defaults={family:"Our Household",theme:"Cozy Bloom",accent:"#8065bb",customUrl:"",wallpaperUUID:"",members:[{id:"m1",name:"Mom",role:"Parent",emoji:"🦋",uuid:""},{id:"m2",name:"Dad",role:"Parent",emoji:"🐼",uuid:""},{id:"m3",name:"Youth",role:"Youth",emoji:"🌸",uuid:""},{id:"m4",name:"Teen",role:"Teen",emoji:"🦊",uuid:""}],chores:[{id:"c1",member:"m3",name:"Tidy your room",points:10,details:"Put away toys and clothes",due:"Today",status:"todo"},{id:"c2",member:"m4",name:"Wash dishes",points:15,details:"Wash and put away dishes",due:"Tonight",status:"todo"}],notes:[{id:"n1",author:"KinKeep",to:"Everyone",text:"Small chores, big teamwork! 🌷"}],announcements:true};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){data=JSON.parse(JSON.stringify(defaults))}
for(const k of Object.keys(defaults))if(data[k]===undefined)data[k]=JSON.parse(JSON.stringify(defaults[k]));
let page="home",selected=null,editing=null,notice="",viewPage=0;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notice="Browser storage unavailable; changes may not persist."}}
function setPage(p,id){page=p;selected=id??null;editing=null;viewPage=0;render()}
function button(t,p,id){return `<button class="secondary small" data-page="${p}" ${id?`data-id="${esc(id)}"`:""}>${t}</button>`}
function member(id){return data.members.find(m=>m.id===id)}
function memberCard(m){return `<button class="profile" data-page="person" data-id="${esc(m.id)}"><span class="emoji">${esc(m.emoji)}</span><b>${esc(m.name)}</b><span class="muted">${esc(m.role)}</span></button>`}
function time(){const now=new Date();return {clock:new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"2-digit"}).format(now),date:new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",weekday:"long",month:"long",day:"numeric"}).format(now)}}
const themes={"Cozy Bloom":["#8065bb","linear-gradient(140deg,#f9e6f2,#e6dcff)"],"Midnight Slate":["#34577d","linear-gradient(140deg,#18263b,#53677f)"],"Warm Neutral":["#92724e","linear-gradient(140deg,#eee0ca,#f8f5ee)"],"Ocean":["#217ca0","linear-gradient(140deg,#d7f4f8,#c1dcf5)"],"Forest":["#437b65","linear-gradient(140deg,#dceede,#b4d6be)"],"Sunset":["#a55b64","linear-gradient(140deg,#ffe3d6,#f2d1e9)"]};
function appearance(){let t=themes[data.theme]||themes["Cozy Bloom"];document.documentElement.style.setProperty("--accent",data.accent||t[0]);document.documentElement.style.setProperty("--bg",data.theme==="Midnight Slate"?"#dce3ef":"#f5efff");let wall=data.theme==="Custom URL"&&/^https:\/\//i.test(data.customUrl)?`url("${data.customUrl.replace(/["\\\n]/g,"")}")`:t[1];document.documentElement.style.setProperty("--wall",wall)}
function home(){const t=time(),done=data.chores.filter(c=>c.status==="approved").length;return `<section class="card hero"><div>Welcome home to ${esc(data.family)} ✨</div><h1 id="clock">${t.clock}</h1><div id="date">${t.date} · SLT (Pacific)</div><small>☁️ Weather: demo placeholder · not live SL weather</small></section><section class="card"><div class="line"><h3>Our little family 🌿</h3>${button("View all →","family")}</div><div class="profiles">${data.members.slice(viewPage*4,viewPage*4+4).map(memberCard).join("")}</div><div class="row" style="justify-content:center;margin-top:9px">${viewPage>0?`<button class="small secondary" data-action="prev">← Previous</button>`:""}${(viewPage+1)*4<data.members.length?`<button class="small secondary" data-action="next">Next →</button>`:""}</div></section><section class="grid apps">${[["🧹","Chores","chores"],["📝","Notes","notes"],["📅","Calendar","calendar"],["🏡","Family","family"],["🖼️","Photos","photos"],["🎨","Settings","settings"]].map(a=>`<button data-page="${a[2]}"><span>${a[0]}</span>${a[1]}</button>`).join("")}</section><section class="card"><h3>💌 Family message</h3><p>${esc(data.notes.at(-1)?.text||"Leave a note for the household!")}</p><div class="line"><small>${done} of ${data.chores.length} chores approved</small>${button("Write a note","notes")}</div></section>`}
function family(){return `<section class="card"><h2>🏡 ${esc(data.family)}</h2><p class="muted">${data.members.length} household members · four shown per home page</p><div class="profiles">${data.members.map(memberCard).join("")}</div></section><section class="card"><h3>Manage family (demo)</h3><form id="addMember" class="stack"><label>Display name<input name="name" required maxlength="45" placeholder="Family member name"></label><label>Role<select name="role"><option>Parent</option><option>Youth</option><option>Teen</option></select></label><label>Second Life avatar UUID (optional for demo)<input name="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><label>Profile emoji<select name="emoji">${emojiOptions("🐼")}</select></label><button>Add family member</button></form><p class="notice">Demo only: parent actions aren't secured. UUIDs are saved locally and do not verify avatar identity.</p></section>`}
const emojis=["🐼","🦋","🌸","🐸","🐻","🌻","🦊","🍓","🐱","🌈","🐢","🍄","🐝","🪷","🐧","⭐","🐰","🌷","🦄","🍒","🌵","🚀","🎮","🐙","🪴","☕","🌙","🐳"];
function emojiOptions(current){return emojis.map(e=>`<option ${current===e?"selected":""}>${e}</option>`).join("")}
function person(id){const m=member(id);if(!m)return `<p>Member not found.</p>`;let cs=data.chores.filter(c=>c.member===id);return `<section class="card"><div class="line"><h2>${esc(m.emoji)} ${esc(m.name)}</h2><span class="pill">${esc(m.role)}</span></div><p>${cs.filter(c=>c.status==="approved").length}/${cs.length} chores approved · ${cs.filter(c=>c.status==="approved").reduce((n,c)=>n+Number(c.points||0),0)} points</p><label>Change profile emoji<select id="profileEmoji" data-member="${esc(id)}">${emojiOptions(m.emoji)}</select></label></section>${cs.map(c=>`<section class="card"><div class="line"><h3>${esc(c.name)}</h3><span class="pill">${esc(c.status)}</span></div><p>${esc(c.details)}</p><p class="muted">Due: ${esc(c.due)} · ${Number(c.points)||0} points</p><div class="row">${c.status==="todo"||c.status==="redo"?`<button class="small" data-action="start" data-id="${esc(c.id)}">Start</button>`:""}${c.status==="started"?`<button class="small" data-action="submit" data-id="${esc(c.id)}">Submit for review</button>`:""}${c.status==="pending"?`<button class="small" data-action="approve" data-id="${esc(c.id)}">Approve (demo parent)</button><button class="small secondary" data-action="redo" data-id="${esc(c.id)}">Request redo</button>`:""}</div></section>`).join("")}<section class="card">${button("Assign chore","assign",id)} ${button("All chores","chores")}</section>`}
function chores(){return `<section class="card"><h2>🧹 Chores</h2><p>Choose a family member to see their personal chores.</p><div class="profiles">${data.members.map(memberCard).join("")}</div></section><section class="card"><h3>Parent dashboard (demo)</h3><div class="row">${button("＋ Assign chores","assign")}${button("Manage family","family")}</div><p class="notice">This prototype lets anyone use demo parent controls. Real parent-only access needs authenticated Second Life UUID + a secure backend.</p></section>`}
function assign(){return `<section class="card"><h2>＋ Assign chores</h2><p class="muted">Select one or several family members. Each gets a separate chore with independent progress and points.</p><form id="assignForm" class="stack"><label>Chore name<input name="name" required maxlength="90" placeholder="e.g., Make your bed"></label><label>Instructions<textarea name="details" placeholder="What needs to be done?"></textarea></label><label>Due date / reminder text<input name="due" value="Today"></label><label>Points per person<input name="points" type="number" min="0" max="9999" value="10"></label><b>Assign to:</b>${data.members.map(m=>`<label style="display:flex;align-items:center;gap:9px"><input type="checkbox" name="recipient" value="${esc(m.id)}" ${selected===m.id?"checked":""}> ${esc(m.emoji)} ${esc(m.name)} (${esc(m.role)})</label>`).join("")}<button>Assign selected members</button></form></section>`}
function notes(){return `<section class="card"><h2>📝 Family Notes</h2><form id="noteForm" class="stack"><label>From<input name="author" placeholder="Your name" required maxlength="45"></label><label>To<select name="to"><option>Everyone</option>${data.members.map(m=>`<option>${esc(m.name)}</option>`).join("")}</select></label><label>Note / reminder<textarea name="text" required maxlength="600" placeholder="Leave a sweet note or a reminder…"></textarea></label><button>Post note</button></form></section>${data.notes.slice().reverse().map(n=>`<section class="card"><div class="line"><b>💌 ${esc(n.author)}</b><span class="pill">To: ${esc(n.to)}</span></div><p>${esc(n.text)}</p><button class="small secondary" data-action="deleteNote" data-id="${esc(n.id)}">Delete (demo)</button></section>`).join("")}`}
function settings(){return `<section class="card"><h2>🎨 Appearance Studio</h2><p>Choose a wallpaper. You can always return to Cozy Bloom.</p><div class="wallgrid">${Object.entries(themes).map(([name,[color,bg]])=>`<button class="wall" style="background:${bg};color:${name==="Midnight Slate"?"white":"#303044"}" data-theme="${esc(name)}">${esc(name)}</button>`).join("")}</div><hr><form id="appearanceForm" class="stack"><label>Household name<input name="family" maxlength="60" value="${esc(data.family)}"></label><label>Accent color<input type="color" name="accent" value="${esc(data.accent)}"></label><label>Custom wallpaper HTTPS image URL<input type="url" name="customUrl" placeholder="https://example.com/wallpaper.jpg" value="${esc(data.customUrl)}"></label><p class="muted">An HTTPS image URL can display behind the interface. Some hosts block embedded images.</p><label>Second Life texture UUID (save for future LSL integration)<input name="wallpaperUUID" placeholder="Texture UUID" value="${esc(data.wallpaperUUID)}"></label><p class="notice">An SL texture UUID cannot be displayed directly as a webpage background. This field stores the choice only; applying it in-world needs additional LSL and a compatible display design.</p><button>Save appearance</button></form><button class="secondary" data-action="resetTheme">Restore Cozy Bloom</button></section><section class="card"><h3>🔔 Reminder preferences (prototype)</h3><p>Nearby chat reminders and personalized UUID greetings require an LSL connection. This webpage does not send in-world chat.</p><p class="muted">Future option: adjustable reminder interval and quiet hours.</p></section>`}
function render(){appearance();const titles={home:"",chores:"Chores",family:"Family",person:"Chore list",assign:"Assign chores",notes:"Notes",settings:"Settings",calendar:"Calendar",photos:"Photos"};let content=page==="home"?home():page==="chores"?chores():page==="family"?family():page==="person"?person(selected):page==="assign"?assign():page==="notes"?notes():page==="settings"?settings():`<section class="card"><h2>${page==="calendar"?"📅 Calendar":"🖼️ Photos"}</h2><p>This app is coming later.</p></section>`; $("app").innerHTML=(page!=="home"?`<nav class="nav">${button("← Home","home")}<b>${titles[page]}</b>${button("Chores","chores")}</nav>`:"")+(notice?`<div class="notice">${esc(notice)}</div>`:"")+content;notice="";tick()}
function tick(){const t=time();if($("headerTime"))$("headerTime").textContent=t.clock+" SLT";if($("clock"))$("clock").textContent=t.clock;if($("date"))$("date").textContent=t.date+" · SLT (Pacific)"}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.page){setPage(b.dataset.page,b.dataset.id);return}if(b.dataset.theme){data.theme=b.dataset.theme;data.accent=themes[data.theme][0];save();render();return}let a=b.dataset.action,id=b.dataset.id;if(a==="next"||a==="prev"){viewPage+=a==="next"?1:-1;render();return}if(a==="resetTheme"){data.theme="Cozy Bloom";data.accent=themes["Cozy Bloom"][0];data.customUrl="";save();render();return}let c=data.chores.find(x=>x.id===id);if(c&&["start","submit","approve","redo"].includes(a)){c.status={start:"started",submit:"pending",approve:"approved",redo:"redo"}[a];save();render();return}if(a==="deleteNote"){data.notes=data.notes.filter(n=>n.id!==id);save();render()}});
document.addEventListener("change",e=>{if(e.target.id==="profileEmoji"){let m=member(e.target.dataset.member);if(m){m.emoji=e.target.value;save();render()}}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==="addMember"){const uuid=String(fd.get("uuid")||"").trim();if(uuid&&!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(uuid)){notice="Enter a valid UUID or leave it blank.";render();return}data.members.push({id:uid(),name:String(fd.get("name")).trim(),role:String(fd.get("role")),emoji:String(fd.get("emoji")),uuid});save();notice="Member added to demo roster.";setPage("family")}if(f.id==="assignForm"){let recipients=fd.getAll("recipient");if(!recipients.length){notice="Select at least one recipient.";render();return}for(const m of recipients)data.chores.push({id:uid(),member:m,name:String(fd.get("name")).trim(),details:String(fd.get("details")),due:String(fd.get("due")),points:Math.max(0,Number(fd.get("points"))||0),status:"todo"});save();notice="Chore assigned to "+recipients.length+" family member(s).";setPage("chores")}if(f.id==="noteForm"){data.notes.push({id:uid(),author:String(fd.get("author")),to:String(fd.get("to")),text:String(fd.get("text"))});save();setPage("notes")}if(f.id==="appearanceForm"){data.family=String(fd.get("family"))||"Our Household";data.accent=String(fd.get("accent"));data.customUrl=String(fd.get("customUrl")).trim();data.wallpaperUUID=String(fd.get("wallpaperUUID")).trim();if(data.customUrl)data.theme="Custom URL";save();notice="Appearance saved in this browser.";setPage("settings")}});
render();setInterval(tick,30000);
</script></body></html>
