<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>KinKeep — 4-Digit Parent PIN Setup</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#302b40;background:#f1edf8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center}
main{width:min(100%,430px);background:#fff;border:1px solid #e9e1f3;border-radius:23px;padding:30px;box-shadow:0 15px 45px #352d5519}
.brand{color:#7a59a8;font-size:14px;font-weight:800;letter-spacing:.03em}h1{font-size:25px;letter-spacing:-.04em;margin:8px 0 9px}p{font-size:14px;line-height:1.55;color:#675e78}
.info{background:#f6f1fe;color:#564579;padding:13px;border-radius:12px;margin:18px 0;font-size:13px;line-height:1.5}
label{display:block;margin:17px 0 7px;font-size:13px;font-weight:750}
input{width:100%;border:1px solid #c9bfda;border-radius:12px;padding:13px;font-size:22px;letter-spacing:.2em;text-align:center;color:#2f2940;background:#fff}
input:focus{outline:2px solid #977cc9;outline-offset:1px}
button{width:100%;border:0;background:#7457aa;color:white;padding:14px;margin-top:24px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:default}#status{margin-top:15px;min-height:24px;font-weight:650;overflow-wrap:anywhere}
footer{font-size:11px;color:#8d839c;margin-top:15px;text-align:center}
</style></head>
<body><main>
<div class="brand">✿ KinKeep</div>
<h1>Create your Parent PIN</h1>
<p>Set the shared household PIN in your private browser. You only need four digits—no long setup code to enter.</p>
<div class="info" id="notice" role="status">Checking your private setup link…</div>
<form id="form" autocomplete="off" hidden>
<label for="pin">Your new 4-digit PIN</label>
<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" required placeholder="••••">
<label for="confirm">Confirm the same PIN</label>
<input id="confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" required placeholder="••••">
<button id="submit" type="submit">Create Parent PIN</button>
</form>
<p id="status" aria-live="polite"></p>
<footer>Parent PIN setup only • Does not unlock Parent permissions</footer>
</main>
<script>
'use strict';
const endpoint='https://qnbnxgaxciqcsszfwsly.supabase.co/functions/v1/kinkeep-parent-setup';
const notice=document.getElementById('notice');
const form=document.getElementById('form');
const statusLine=document.getElementById('status');
const submit=document.getElementById('submit');
const match=location.hash.match(/^#setup=([a-fA-F0-9]{32})$/);
// Keep ticket in memory for the few minutes of setup, not in localStorage or the visible URL.
let ticket=match?match[1].toUpperCase():null;
if(ticket){
  try{history.replaceState(null,'',location.pathname);}catch{/* URL is still in hash if history is unavailable */}
  notice.textContent='Private setup approved. Choose four digits and confirm them.';
  form.hidden=false;
}else{
  notice.textContent='Open this page from your Second Life tablet: type /984621 setup as the registered owner. Your tablet will open a private setup link.';
}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(submit.disabled||!ticket)return;
  const pin=document.getElementById('pin').value;
  const confirm=document.getElementById('confirm').value;
  if(!/^[0-9]{4}$/.test(pin)){statusLine.textContent='Enter exactly 4 digits.';return;}
  if(pin!==confirm){statusLine.textContent='The two PIN entries do not match.';return;}
  submit.disabled=true;
  statusLine.textContent='Creating your PIN securely…';
  try{
    const response=await fetch(endpoint,{
      method:'POST',mode:'cors',cache:'no-store',referrerPolicy:'no-referrer',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'complete',setup_code:ticket,pin})
    });
    const result=await response.json().catch(()=>({}));
    if(response.ok&&result.ok===true){
      ticket=null;form.reset();form.hidden=true;
      notice.textContent='✓ Your 4-digit Parent PIN has been created!';
      statusLine.textContent='Success. You can close this window.';
    }else{
      statusLine.textContent=result.error||'Setup could not be completed. Start again from your tablet.';
      submit.disabled=false;
    }
  }catch{
    statusLine.textContent='Connection error. Check the Supabase function and try again.';
    submit.disabled=false;
  }finally{
    document.getElementById('pin').value='';
    document.getElementById('confirm').value='';
  }
});
</script>
</body></html>
