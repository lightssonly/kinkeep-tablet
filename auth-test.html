<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KinKeep — Family Studio v0.6 • Account Preview</title>
<style>
:root{--accent:#8165b8;--ink:#29243c;--bg:#f2e7fb;--card:#ffffffed;--wall:linear-gradient(140deg,#fce6f0,#e5ddff)}
*{box-sizing:border-box}body{margin:0;background:#d9d3e5;font:15px/1.4 system-ui,'Segoe UI',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:var(--accent);color:white;padding:10px 13px;border-radius:12px;font-weight:600}button.secondary{background:#fff;color:var(--ink);border:1px solid #cfc5d8}button.ghost{background:transparent;color:var(--accent);padding:6px 9px}button.danger{background:#a94c68}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #5389bd;outline-offset:1px}
.shell{width:min(100%,530px);min-height:100vh;margin:auto;background:linear-gradient(#ffffff8f,#ffffff8f),var(--wall),var(--bg);background-size:cover;background-position:center;box-shadow:0 3px 28px #0003;padding:15px 15px 35px}.bar,.spread,.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar{font-weight:800;margin-bottom:11px}.brand{font-size:18px}.muted{font-size:12px;color:#696379}.note{background:#fff6d9;border:1px solid #efdfb1;padding:10px 12px;border-radius:12px;font-size:12px}.card{border-radius:19px;background:var(--card);padding:15px;margin:12px 0;box-shadow:0 4px 16px #0000000c;border:1px solid #ffffffbe}.hero{background:linear-gradient(125deg,var(--accent),#405575);color:#fff;padding:19px}.hero h1{font-size:40px;margin:6px 0}.hero .muted{color:#f1ecff}h2{margin:6px 0 13px;font-size:23px}h3{margin:6px 0 9px;font-size:17px}p{margin:8px 0 12px}.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.apps button{background:#fffffff2;color:var(--ink);padding:13px 3px;min-height:86px;font-size:13px}.apps .icon{font-size:27px;display:block}.profiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.profile{border:1px solid #ddd1eb;border-radius:12px;background:white;color:var(--ink);padding:8px 3px;min-width:0;font-size:11px;font-weight:500}.profile .icon{font-size:26px;display:block}.profile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stack{display:grid;gap:11px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:grid;gap:4px;font-size:13px;font-weight:650}input:not([type=checkbox]),textarea,select{border:1px solid #cac0d8;border-radius:10px;background:#fff;padding:10px;color:var(--ink);width:100%;min-width:0}textarea{min-height:75px;resize:vertical}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.pill{background:#eee9f5;color:#4c4560;border-radius:25px;padding:4px 8px;font-size:11px;display:inline-block}.subtle{background:#f6f1fa;border-radius:12px;padding:11px}.nav{margin:8px 0 13px}.nav b{font-size:13px}.mini{padding:7px 9px;font-size:12px}.wall{height:88px;display:flex;justify-content:center;align-items:end;text-shadow:0 1px 3px #fff;color:#29243c;border:2px solid #fff}.divider{height:1px;background:#e7ddec;margin:12px 0}.check{display:flex;align-items:center;gap:8px;font-weight:500}.check input{width:auto}.action-list{display:grid;gap:8px}.action-list>div{background:#faf7fd;border-radius:10px;padding:10px}.emoji-picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.emoji-picker button{background:#fff;color:#3b3449;border:1px solid #e0d7ec;padding:7px 0;font-size:21px}.emoji-picker button.active{border:3px solid var(--accent)}.status{color:#54445b;font-weight:650;font-size:12px}.hide{display:none}.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.toolbar>*{flex:1}.secondaryline{background:#fff9; border-radius:12px;padding:10px}.small{font-size:12px}.black{color:#332f40}footer{margin-top:16px;text-align:center;font-size:11px;color:#655b73}.intro{font-size:12px;background:#fff;padding:10px;border-radius:10px;margin-top:8px}
@media(max-width:375px){.shell{padding:10px}.apps{gap:6px}.card{padding:12px}.hero h1{font-size:34px}.profile .icon{font-size:21px}.mini{font-size:11px}}
</style></head>
<body><main class="shell"><div class="bar"><span class="brand">✿ KinKeep <span class="muted">v0.6</span></span><span class="row"><button class="secondary mini" data-page="account" id="accountQuick" type="button">🔐 Account</button><span id="sltBar" class="muted">SLT</span></span></div><div id="app"><section class="card hero"><div>Welcome home ✨</div><h1>KinKeep</h1><p>Family chores, made cozy.</p></section><section class="card"><h3>Our little family 🌿</h3><div class="profiles"><div class="profile"><span class="icon">🦋</span><b>Mom</b></div><div class="profile"><span class="icon">🐼</span><b>Dad</b></div><div class="profile"><span class="icon">🌸</span><b>Youth</b></div><div class="profile"><span class="icon">🦊</span><b>Teen</b></div></div></section><section class="apps"><button>🧹 Chores</button><button>📝 Notes</button><button>⭐ Goals</button><button>🏡 Family</button><button>⏰ Routines</button><button>🎨 Settings</button></section><div class="note">Loading KinKeep's interactive features…</div></div><footer>KinKeep v0.6 · Real Supabase Auth test · ALL chores, roles and Parent PIN stay browser-local DEMOS</footer></main>
<script>
'use strict';
const STORE='kinkeep-v05-demo',OLD='kinkeep-v04-demo';
// Only PUBLIC client configuration belongs in this file. Never add sb_secret or service_role.
const SUPABASE_PROJECT_URL='https://qnbnxgaxciqcsszfwsly.supabase.co';
const SUPABASE_PUBLIC_KEY='sb_publishable_UpsibS9tWLPOZKIIj4O25A_eXD3LXpF';
let authUser=null, authAccessToken=null, authInFlight=false;
const ROLE=['Parent','Adult','Caregiver / Nanny','Youth','Teen','Custom'];
const GRANTS=['assign','approve','bonus','routines','goals','notes','members','settings'];
const GRANT_LABELS={assign:'Assign chores',approve:'Approve chores / request redo',bonus:'Award bonus points',routines:'Create or change routines',goals:'Set daily goal requirements',notes:'Moderate notes',members:'Manage family & permissions',settings:'Change household settings'};
const EMOJIS=['🦋','🐼','🌸','🦊','🐸','🐻','🌻','🍓','🐱','🐢','🍄','🐝','🪷','🐧','⭐','🐰','🌷','🦄','🍒','🌵','🚀','🎮','🐙','🪴','🌙','🐳'];
const IDEAS=['📚 Read for 20 minutes','🌳 Spend time outdoors','🎨 Create something','💪 Move your body','🧘 Take a mindfulness break','✍️ Write in a journal','🧩 Learn something new','🎵 Practice a skill'];
const THEMES={'Cozy Bloom':['#8165b8','linear-gradient(135deg,#fbe5f1,#e5ddff)'],'Midnight Slate':['#375479','linear-gradient(135deg,#1e2c42,#61738b)'],'Warm Neutral':['#96724a','linear-gradient(135deg,#e7d7bf,#f8f3e9)'],'Ocean':['#20799a','linear-gradient(135deg,#c5ebee,#d5e1fb)'],'Forest':['#437b65','linear-gradient(135deg,#c8e2d1,#e8efc8)'],'Sunset':['#ab6168','linear-gradient(135deg,#fbd9d4,#f9e1af)']};
const seed={family:'Our Household',theme:'Cozy Bloom',accent:'#8165b8',customUrl:'',wallpaperUUID:'',pinSalt:'',pinHash:'',members:[{id:'m1',name:'Mom',role:'Parent',emoji:'🦋',uuid:'',permissions:[]},{id:'m2',name:'Dad',role:'Parent',emoji:'🐼',uuid:'',permissions:[]},{id:'m3',name:'Youth',role:'Youth',emoji:'🌸',uuid:'',permissions:[]},{id:'m4',name:'Teen',role:'Teen',emoji:'🦊',uuid:'',permissions:[]}],chores:[{id:'c1',member:'m3',name:'Tidy your room',points:10,details:'Put away toys and clothes',due:'Today',status:'todo'},{id:'c2',member:'m4',name:'Wash dishes',points:15,details:'Wash and put away dishes',due:'Tonight',status:'todo'}],notes:[{id:'n1',author:'KinKeep',to:'Everyone',text:'Small chores, big teamwork! 🌷'}],goalRequirements:{m4:2},goals:[],routines:[]};
const clone=x=>JSON.parse(JSON.stringify(x));
let db;try{let fresh=localStorage.getItem(STORE),old=localStorage.getItem(OLD);db=fresh?JSON.parse(fresh):old?Object.assign(clone(seed),JSON.parse(old)):clone(seed)}catch(e){db=clone(seed)}
for(const k of Object.keys(seed)){if(db[k]===undefined)db[k]=clone(seed[k])}
if(!Array.isArray(db.members))db.members=clone(seed.members);
for(const m of db.members){m.permissions=Array.isArray(m.permissions)?m.permissions:[];if(!ROLE.includes(m.role))m.role='Custom'}
let page='home',personId=null,activeId=db.members[0]?.id||'',rosterPage=0,message='',unlockUntil=0,attempts=0,triesAt=0;
const el=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const actor=()=>db.members.find(m=>m.id===activeId),byId=i=>db.members.find(m=>m.id===i),isParent=()=>actor()?.role==='Parent',isUnlocked=()=>isParent()&&Date.now()<unlockUntil;
function may(action){const a=actor();if(!a)return false;if(a.role==='Parent')return isUnlocked();return a.permissions.includes(action)&&!['members','settings'].includes(action)}
function store(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){message='Browser storage unavailable. Changes may not persist.';return false}}
function pageTo(p,target){page=p;personId=target||null;rosterPage=0;render()}
function announce(t){message=t;render()}
function controls(label,p,target){return `<button class="secondary mini" data-page="${p}" ${target?`data-target="${esc(target)}"`:''}>${label}</button>`}
function dateTime(){const d=new Date(),options={timeZone:'America/Los_Angeles'};const clock=new Intl.DateTimeFormat('en-US',{...options,hour:'numeric',minute:'2-digit'}).format(d);const date=new Intl.DateTimeFormat('en-US',{...options,weekday:'long',month:'short',day:'numeric'}).format(d);const day=new Intl.DateTimeFormat('en-CA',{...options,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);return {clock,date,day}}
function styleTheme(){let bg=(THEMES[db.theme]||THEMES['Cozy Bloom'])[1],accent=db.accent||'#8165b8';if(db.theme==='Custom URL'&&/^https:\/\//i.test(db.customUrl))bg=`url("${db.customUrl.replace(/["\\\n\r]/g,'')}")`;document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--wall',bg)}
function roleName(m){return m.role==='Custom'&&m.customRole?m.customRole:m.role}
function prof(m){return `<button class="profile" data-page="person" data-target="${esc(m.id)}"><span class="icon">${esc(m.emoji)}</span><b>${esc(m.name)}</b><span class="muted">${esc(roleName(m))}</span></button>`}
function actorWidget(){return `<div class="intro"><label class="field">👤 Preview as (NOT avatar authentication)<select id="actor">${db.members.map(m=>`<option value="${esc(m.id)}" ${activeId===m.id?'selected':''}>${esc(m.emoji)} ${esc(m.name)} · ${esc(roleName(m))}</option>`).join('')}</select></label><p class="muted">Switching identities is just for testing. Real identity checks require LSL and a secure server.</p></div>`}
function home(){const t=dateTime(),d=db.chores.filter(c=>c.status==='approved').length;return `<section class="card hero"><div>Welcome home to ${esc(db.family)} ✨</div><h1 id="clock">${t.clock}</h1><div id="date">${t.date} · Second Life Time</div><p class="muted">☁️ Weather is a demo placeholder — not a live SL forecast.</p></section><section class="card"><div class="spread"><h3>Our little family 🌿</h3>${controls('All members →','family')}</div><div class="profiles">${db.members.slice(rosterPage*4,rosterPage*4+4).map(prof).join('')}</div><div class="row" style="justify-content:center;margin-top:9px">${rosterPage>0?'<button class="secondary mini" data-action="prev">← Previous</button>':''}${(rosterPage+1)*4<db.members.length?'<button class="secondary mini" data-action="next">Next →</button>':''}</div></section><section class="apps">${[['🧹','Chores','chores'],['📝','Notes','notes'],['⭐','Daily Goals','goals'],['🏡','Family','family'],['⏰','Routines','routines'],['🎨','Settings','settings'],['📅','Calendar','calendar'],['🖼️','Photos','photos'],['🔐','Account','account']].map(a=>`<button data-page="${a[2]}"><span class="icon">${a[0]}</span>${a[1]}</button>`).join('')}</section><section class="card"><h3>💌 Family message</h3><p>${esc(db.notes.at(-1)?.text||'Leave a note for everyone!')}</p><div class="spread"><span class="muted">${d}/${db.chores.length} chores approved</span>${controls('Write a note','notes')}</div></section>${actorWidget()}`}
function family(){return `<section class="card"><h2>🏡 ${esc(db.family)}</h2><p class="muted">${db.members.length} member(s). Four appear at once on the home screen.</p><div class="profiles">${db.members.map(prof).join('')}</div></section>${may('members')?`<section class="card"><h3>➕ Add family member</h3><form id="newMember" class="stack"><label class="field">Display name<input name="name" required maxlength="45"></label><label class="field">Household role<select name="role">${ROLE.map(r=>`<option>${esc(r)}</option>`).join('')}</select></label><label class="field">Custom relationship label (optional, e.g., Aunt, Grandparent)<input name="customRole" maxlength="40" placeholder="Only used when role is Custom"></label><label class="field">Second Life avatar UUID (optional demo)<input name="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><label class="field">Profile emoji<select name="emoji">${EMOJIS.map(e=>`<option>${e}</option>`).join('')}</select></label><button>Add member</button></form></section><section class="card"><h3>🛡️ Manage permissions</h3><p class="muted">An adult or caregiver is NOT automatically a parent. Grant only the actions they need.</p>${db.members.map(m=>`<div class="spread subtle" style="margin-bottom:7px"><div>${esc(m.emoji)} <b>${esc(m.name)}</b> <span class="pill">${esc(roleName(m))}</span></div>${controls('Edit →','memberedit',m.id)}</div>`).join('')}</section>`:`<section class="card note">Only a parent who has unlocked Parent Access can add members or change permissions. Other adults do not receive automatic admin access. ${controls('Parent Access','access')}</section>`}`}
function editMember(uid){if(!may('members'))return lockPage('Manage members');let m=byId(uid);if(!m)return `<section class="card">Member not found.</section>`;return `<section class="card"><h2>🛡️ ${esc(m.name)}</h2><form id="editMember" data-member="${esc(uid)}" class="stack"><label class="field">Display name<input name="name" maxlength="45" required value="${esc(m.name)}"></label><label class="field">Role<select name="role">${ROLE.map(r=>`<option ${m.role===r?'selected':''}>${esc(r)}</option>`).join('')}</select></label><label class="field">Custom relationship label<input name="customRole" maxlength="40" value="${esc(m.customRole||'')}" placeholder="Aunt, Grandparent, etc."></label><label class="field">Profile emoji<select name="emoji">${EMOJIS.map(e=>`<option ${m.emoji===e?'selected':''}>${e}</option>`).join('')}</select></label><label class="field">Second Life UUID (display metadata only)<input name="uuid" value="${esc(m.uuid)}"></label><h3>Extra permissions</h3><p class="muted">Non-parent roles begin with no elevated permissions. Only actual approved roles and server verification will make these secure in the finished system.</p>${GRANTS.filter(x=>!['members','settings'].includes(x)).map(k=>`<label class="check"><input type="checkbox" name="grant" value="${k}" ${m.permissions.includes(k)?'checked':''}> ${GRANT_LABELS[k]}</label>`).join('')}<button>Save member & permissions</button></form></section>`}
function pinPage(){return `<section class="card"><h2>🔐 Parent Access</h2><p class="muted">Major settings require a parent PIN in this demo. This does not establish real Second Life avatar identity.</p>${!isParent()?`<div class="note">The selected preview profile is not a Parent. Switch to a parent profile to test access.</div>${actorWidget()}`:!db.pinHash?`<form id="setPin" class="stack"><label class="field">Set a 4–8 digit PIN<input type="password" name="pin" inputmode="numeric" minlength="4" maxlength="8" pattern="[0-9]{4,8}" required autocomplete="new-password"></label><label class="field">Confirm PIN<input type="password" name="confirm" inputmode="numeric" minlength="4" maxlength="8" pattern="[0-9]{4,8}" required autocomplete="new-password"></label><button>Create demo Parent PIN</button></form><p class="note">First-time setup is NOT restricted to your SL owner in this public webpage. Don't use a real password or a sensitive PIN. Security must be implemented server-side later.</p>`:isUnlocked()?`<div class="note">✅ Demo Parent Access unlocked for this browser session for up to 5 minutes.</div><div class="row" style="margin-top:10px">${controls('Manage Family','family')}${controls('Parent Dashboard','admin')}${controls('Settings','settings')}<button class="danger mini" data-action="lock">Lock now</button></div>`:`<form id="unlockPin" class="stack"><label class="field">Enter Parent PIN<input type="password" name="pin" required maxlength="8" inputmode="numeric" autocomplete="off"></label><button>Unlock Parent Access</button></form><p class="note">Demo-only PIN gate. Local/browser code can be bypassed; never rely on it to protect real parent controls.</p>`}</section>`}
function lockPage(reason){return `<section class="card"><h2>🔐 ${reason}</h2><p>Authorized access is needed for this action.</p>${controls('Open Parent Access','access')} ${controls('Home','home')}</section>`}
function admin(){if(!may('members'))return lockPage('Parent Dashboard');return `<section class="card"><h2>👑 Parent Dashboard</h2><p>Major settings are temporarily unlocked in this demo.</p><div class="action-list">${[['👥 Manage household','family'],['🧹 Assign chores','assign'],['✅ Review submissions','review'],['⭐ Daily goal requirements','goaladmin'],['⏰ Schedule reminders','routinemanage'],['🎨 Customize tablet','settings']].map(([t,p])=>`<div>${controls(t,p)}</div>`).join('')}</div></section>`}
function chores(){return `<section class="card"><h2>🧹 Family Chores</h2><p>Everyone can browse the family chore lists.</p><div class="profiles">${db.members.map(prof).join('')}</div></section><section class="card"><h3>Management</h3><div class="row">${may('assign')?controls('＋ Assign chores','assign'):''}${may('approve')?controls('Review submissions','review'):''}${isParent()&&!isUnlocked()?controls('🔐 Parent Access','access'):''}</div><p class="muted">Children can update their own demo chores using Preview as. Parents/caregivers need granted access for review actions.</p></section>`}
function choreMember(uid){let m=byId(uid);if(!m)return `<div class="card">Member missing.</div>`;const list=db.chores.filter(c=>c.member===uid);return `<section class="card"><div class="spread"><h2>${esc(m.emoji)} ${esc(m.name)}</h2><span class="pill">${esc(m.role)}</span></div><p class="muted">${list.filter(c=>c.status==='approved').length}/${list.length} approved · ${list.filter(c=>c.status==='approved').reduce((s,c)=>s+Number(c.points||0),0)} points</p>${activeId===uid?`<label class="field">My profile emoji<select id="selfEmoji" data-target="${esc(uid)}">${EMOJIS.map(e=>`<option ${e===m.emoji?'selected':''}>${e}</option>`).join('')}</select></label>`:''}</section>${list.length?list.map(c=>`<section class="card"><div class="spread"><h3>${esc(c.name)}</h3><span class="pill">${esc(c.status)}</span></div><p>${esc(c.details)}</p><p class="muted">Due ${esc(c.due)} · ${Number(c.points)||0} points</p><div class="row">${activeId===uid&&['todo','redo'].includes(c.status)?`<button class="mini" data-action="choreStart" data-id="${esc(c.id)}">Start</button>`:''}${activeId===uid&&c.status==='started'?`<button class="mini" data-action="choreSubmit" data-id="${esc(c.id)}">Submit</button>`:''}${may('approve')&&c.status==='pending'?`<button class="mini" data-action="choreApprove" data-id="${esc(c.id)}">Approve</button><button class="mini secondary" data-action="choreRedo" data-id="${esc(c.id)}">Redo</button>`:''}</div></section>`).join(''):`<section class="card">No chores assigned yet.</section>`}${may('assign')?`<section class="card">${controls('＋ Assign a chore','assign',uid)}</section>`:''}`}
function assign(){if(!may('assign'))return lockPage('Assign chores');return `<section class="card"><h2>＋ Assign chores</h2><p>Each selected family member receives a separate assignment and status.</p><form id="assign" class="stack"><label class="field">Chore<input name="name" maxlength="100" required></label><label class="field">Instructions<textarea name="details"></textarea></label><label class="field">Due<input name="due" value="Today"></label><label class="field">Points per member<input name="points" type="number" min="0" max="9999" value="10"></label><b>Assign to</b>${db.members.map(m=>`<label class="check"><input type="checkbox" name="who" value="${esc(m.id)}" ${personId===m.id?'checked':''}>${esc(m.emoji)} ${esc(m.name)} · ${esc(roleName(m))}</label>`).join('')}<button>Assign selected members</button></form></section>`}
function review(){if(!may('approve'))return lockPage('Review chores');let cs=db.chores.filter(c=>c.status==='pending');return `<section class="card"><h2>✅ Review submissions</h2><p class="muted">${cs.length} chore(s) waiting</p></section>${cs.map(c=>`<section class="card"><h3>${esc(c.name)} — ${esc(byId(c.member)?.name||'Unknown')}</h3><p>${esc(c.details)}</p><div class="row"><button class="mini" data-action="choreApprove" data-id="${esc(c.id)}">Approve</button><button class="mini secondary" data-action="choreRedo" data-id="${esc(c.id)}">Request redo</button></div></section>`).join('')}`}
function goals(){let today=dateTime().day,m=actor(),mine=db.goals.filter(g=>g.member===activeId&&g.day===today),required=Math.max(0,Number(db.goalRequirements[activeId]||0)),done=mine.filter(g=>g.status==='approved').length;return `<section class="card"><h2>⭐ Daily Goals</h2><p>Pick something positive to work on each day.</p><div class="subtle">${esc(m?.emoji||'⭐')} ${esc(m?.name||'Member')} · ${mine.length} chosen today · ${done} approved · ${required} required</div>${(m?.role==='Teen'||m?.role==='Youth')?`<p class="muted">Choose your own goals. A parent can set your daily goal requirement.</p>`:''}</section><section class="card"><h3>Today's goals</h3>${mine.length?mine.map(g=>`<div class="subtle" style="margin:7px 0"><div class="spread"><b>${esc(g.name)}</b><span class="pill">${esc(g.status)}</span></div><div class="row" style="margin-top:7px">${['selected','redo'].includes(g.status)?`<button class="mini" data-action="goalSubmit" data-id="${esc(g.id)}">Submit completed</button>`:''}${g.status==='pending'&&may('approve')?`<button class="mini" data-action="goalApprove" data-id="${esc(g.id)}">Approve</button><button class="mini secondary" data-action="goalRedo" data-id="${esc(g.id)}">Redo</button>`:''}</div></div>`).join(''):'<p class="muted">No goals chosen today.</p>'}</section><section class="card"><h3>Choose a goal</h3><div class="row">${IDEAS.map((idea,n)=>`<button class="mini secondary" data-action="chooseIdea" data-index="${n}">${esc(idea)}</button>`).join('')}</div><form id="customGoal" class="stack" style="margin-top:12px"><label class="field">Or write your own goal<input name="name" maxlength="90" required placeholder="e.g., Read a chapter"></label><button>Add my goal</button></form></section>${may('goals')?`<section class="card">${controls('Set goal requirements','goaladmin')}</section>`:''}<p class="muted">Demo goal completion is not verified by SL or a parent backend.</p>`}
function goalAdmin(){if(!may('goals'))return lockPage('Goal requirements');return `<section class="card"><h2>⭐ Daily Goal Requirements</h2><p>Set how many goals each youth or teen should choose daily. These are per-person targets.</p><form id="goalRules" class="stack">${db.members.filter(m=>['Youth','Teen'].includes(m.role)).map(m=>`<label class="field">${esc(m.emoji)} ${esc(m.name)} (${m.role})<input type="number" min="0" max="12" name="require-${esc(m.id)}" value="${Number(db.goalRequirements[m.id]||0)}"></label>`).join('')}<button>Save requirements</button></form></section>`}
function routineList(){let sorted=db.routines.slice().sort((a,b)=>a.time.localeCompare(b.time));return `<section class="card"><h2>⏰ Family Routines</h2><p>Parent-configured reminders use <b>Second Life Time (Pacific)</b>. Each member can have a different schedule.</p><p class="note">These are saved schedule previews only. The current webpage does <b>not</b> send timed in-world chat; that needs an LSL reminder script and reliable shared configuration.</p>${sorted.length?sorted.map(r=>`<div class="subtle" style="margin:9px 0"><div class="spread"><b>${esc(r.time)} · ${esc(r.label)}</b><span class="pill">${r.enabled?'Scheduled preview':'Disabled'}</span></div><div class="muted">${esc(byId(r.member)?.name||'Unknown')} · ${esc(r.days)}</div>${may('routines')?`<button class="mini secondary" data-action="deleteRoutine" data-id="${esc(r.id)}" style="margin-top:7px">Remove schedule</button>`:''}</div>`).join(''):'<p>No routines have been added yet.</p>'}</section>${may('routines')?`<section class="card">${controls('Add a routine','routinemanage')}</section>`:''}`}
function routineManage(){if(!may('routines'))return lockPage('Routine scheduler');return `<section class="card"><h2>⏰ Add a routine</h2><p>Configure individual homework, hygiene, and bedtime reminders.</p><form id="addRoutine" class="stack"><label class="field">For member<select name="member">${db.members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} · ${esc(roleName(m))}</option>`).join('')}</select></label><label class="field">Routine<select name="label"><option>📚 Homework</option><option>🪥 Brush teeth</option><option>🛁 Bath or shower</option><option>🌙 Bedtime</option><option>⭐ Daily goals</option><option>🧹 Chores</option></select></label><label class="field">Reminder time (SLT)<input type="time" name="time" required value="20:00"></label><label class="field">Days<select name="days"><option>Every day</option><option>Weekdays</option><option>Weekends</option></select></label><button>Add reminder schedule</button></form></section>${routineList()}`}
function notes(){return `<section class="card"><h2>📝 Family Notes</h2><p class="muted">All notes here are visible to anyone using this demo; “To” is a label, not private messaging.</p><form id="noteForm" class="stack"><label class="field">From<input readonly value="${esc(actor()?.name||'Guest')}"></label><label class="field">To<select name="to"><option>Everyone</option>${db.members.map(m=>`<option>${esc(m.name)}</option>`).join('')}</select></label><label class="field">Message<textarea name="text" maxlength="600" required placeholder="Leave a kind note or reminder"></textarea></label><button>Post note</button></form></section>${db.notes.slice().reverse().map(n=>`<section class="card"><div class="spread"><b>💌 ${esc(n.author)}</b><span class="pill">To: ${esc(n.to)}</span></div><p>${esc(n.text)}</p>${may('notes')||n.author===actor()?.name?`<button class="mini secondary" data-action="deleteNote" data-id="${esc(n.id)}">Delete note</button>`:''}</section>`).join('')}`}
function settings(){return `<section class="card"><h2>🎨 Appearance Studio</h2><p>All homes can browse designs; only an unlocked demo Parent can save household settings.</p><div class="grid2">${Object.entries(THEMES).map(([name,[color,bg]])=>`<button class="wall" style="background:${bg}" data-theme="${esc(name)}" ${!may('settings')?'disabled':''}>${esc(name)}</button>`).join('')}</div>${may('settings')?`<form id="appearance" class="stack" style="margin-top:13px"><label class="field">Household name<input name="family" maxlength="60" value="${esc(db.family)}"></label><label class="field">Accent color<input type="color" name="accent" value="${esc(db.accent)}"></label><label class="field">Custom image HTTPS URL<input name="customUrl" type="url" value="${esc(db.customUrl)}" placeholder="https://example.com/wallpaper.jpg"></label><label class="field">SL texture UUID (stored for future LSL integration only)<input name="wallpaperUUID" value="${esc(db.wallpaperUUID)}"></label><button>Save appearance</button></form><button class="secondary mini" data-action="resetTheme" style="margin-top:10px">Restore Cozy Bloom</button>`:`<p class="note">Major settings are locked. ${isParent()?'Open Parent Access to unlock.':'Only authorized parents can change them.'}</p>${controls('Parent Access','access')}`}<p class="muted">An SL texture UUID does not display directly as an HTML wallpaper. HTTPS images may be blocked by their hosts.</p></section>`}

// SUPABASE AUTH ONLY: does not grant KinKeep household roles or read/write KinKeep SQL tables.
// Tokens remain in memory and are dropped on refresh/closing the page. This is intentional
// for the shared tablet prototype. Do not enter real credentials inside a shared SL MOAP.
function accountPage(){
  if(authUser){
    return `<section class="card"><h2>🔐 Supabase Account</h2><p class="note">✅ You are signed in to Supabase Auth. This proves only that this email account is verified; it does <b>not</b> authorize Parent privileges or connect to an avatar UUID.</p><p><b>Email:</b> ${esc(authUser.email||'Account verified')}</p><p class="muted">Session held temporarily in this page only. Reloading signs you out.</p><button class="secondary" data-auth="signout">Sign out</button></section><section class="card"><h3>Next connection</h3><p>We will securely link this account to an adult's Second Life UUID and add household-specific database access policies. The current chore lists and PIN are still local demonstrations.</p></section>`;
  }
  return `<section class="card"><h2>🔐 KinKeep Account</h2><p>Sign in to Supabase Auth using your own adult account.</p><div class="note"><b>Before you begin:</b> Open this page in your personal Chrome or Edge window, <b>not on the shared Second Life board</b>. Sign-in is real, but this is not yet verified Parent Access. Do not create children's accounts here.</div></section>
  <section class="card"><h3>Sign in</h3><form id="supabaseSignIn" class="stack"><label class="field">Email address<input type="email" name="email" autocomplete="username" required></label><label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label><button ${authInFlight?'disabled':''} type="submit">${authInFlight?'Connecting…':'Sign in to Supabase'}</button></form></section>
  <section class="card"><h3>Create an account</h3><p class="muted">Only use your own email. Supabase may send a confirmation message before you can sign in.</p><form id="supabaseSignUp" class="stack"><label class="field">Email address<input type="email" name="email" autocomplete="email" required></label><label class="field">New password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><button ${authInFlight?'disabled':''} type="submit">Create test account</button></form></section>
  <section class="card"><p class="muted">Troubleshooting: In Supabase → Authentication → Providers, Email must be enabled. Under URL Configuration, the Site URL should be <code>https://lightssonly.github.io/kinkeep-tablet/</code>. If email confirmation is on, confirm via email, then sign in.</p></section>`;
}
async function authRequest(path, options={}){
  const {method='GET', body=null, token=null}=options;
  let headers={'apikey':SUPABASE_PUBLIC_KEY,'Accept':'application/json'};
  if(body!==null)headers['Content-Type']='application/json';
  if(token)headers.Authorization='Bearer '+token;
  let response;
  try{
    response=await fetch(SUPABASE_PROJECT_URL+'/auth/v1'+path,{method,headers,body:body===null?undefined:JSON.stringify(body),cache:'no-store'});
  }catch(error){throw new Error('Connection failed. Open KinKeep from its HTTPS GitHub Pages address and check your internet connection.');}
  const payload=await response.json().catch(()=>({}));
  if(!response.ok){
    throw new Error(payload.error_description||payload.msg||payload.message||payload.error||('Supabase returned HTTP '+response.status));
  }
  return payload;
}
async function signInToSupabase(email,password){
  const session=await authRequest('/token?grant_type=password',{method:'POST',body:{email,password}});
  if(!session.access_token)throw new Error('Supabase did not return an access token.');
  // Verify token server-side before displaying an authenticated state.
  const user=await authRequest('/user',{token:session.access_token});
  if(!user?.id)throw new Error('Supabase did not verify this account.');
  authAccessToken=session.access_token;
  authUser={id:user.id,email:user.email||email};
  // Avoid accidentally suggesting the authenticated account is the in-world avatar.
  unlockUntil=0;
}
async function signOutOfSupabase(){
  let tok=authAccessToken;
  authAccessToken=null;authUser=null;unlockUntil=0;
  if(tok){try{await authRequest('/logout',{method:'POST',token:tok})}catch(error){/* local sign out still succeeds */}}
}
// Supabase's default email-confirmation redirects may contain a short-lived auth
// fragment. Never preserve it in the browser address or browser history.
try{
  if(location.hash&&(location.hash.includes('access_token=')||location.hash.includes('refresh_token=')||location.hash.includes('error='))){
    history.replaceState(null,'',location.pathname+location.search);
    message='Email confirmation opened this site. Please sign in using the Account app.';
  }
}catch(error){}
function render(){styleTheme();let names={home:'Home',family:'Family',memberedit:'Member permissions',access:'Parent Access',admin:'Parent Dashboard',chores:'Chores',person:'Personal chores',assign:'Assign chores',review:'Review',goals:'Daily Goals',goaladmin:'Goal Requirements',routines:'Routines',routinemanage:'Schedule Reminder',notes:'Notes',settings:'Settings',calendar:'Calendar',photos:'Photos',account:'Supabase Account'};let view={home, family,memberedit:()=>editMember(personId),access:pinPage,admin,chores,person:()=>choreMember(personId),assign,review,goals,goaladmin:goalAdmin,routines:routineList,routinemanage:routineManage,notes,settings,calendar:()=>'<section class="card"><h2>📅 Calendar</h2><p>Coming later — future reminders and family events will live here.</p></section>',photos:()=>'<section class="card"><h2>🖼️ Photos</h2><p>Coming later — decorative app for now.</p></section>',account:accountPage}[page]||home;
const top=page==='home'?'':`<nav class="nav">${controls('← Home','home')}<b>${names[page]||'KinKeep'}</b>${controls('Chores','chores')}</nav>`;
el('app').innerHTML=top+(message?`<div class="note" style="margin:10px 0">${esc(message)}</div>`:'')+view();message='';updateClock();const quick=el('accountQuick');if(quick)quick.textContent=authUser?'🔐 Signed in':'🔐 Account'}
function updateClock(){const t=dateTime();if(el('sltBar'))el('sltBar').textContent=t.clock+' SLT';if(el('clock'))el('clock').textContent=t.clock;if(el('date'))el('date').textContent=t.date+' · Second Life Time'}
async function pinDigest(s){if(!globalThis.crypto?.subtle)throw Error('Secure hashing is unavailable in this browser. Open the page over HTTPS.');const b=new TextEncoder().encode(s);let result=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(result)).map(n=>n.toString(16).padStart(2,'0')).join('')}
function requireGrant(grant){if(may(grant))return true;message='This profile is not authorized for that action.';render();return false}
function handleClick(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.auth==='signout'){signOutOfSupabase().then(()=>announce('Signed out from Supabase on this page.'));return}if(b.dataset.page){pageTo(b.dataset.page,b.dataset.target);return}if(b.dataset.theme){if(!requireGrant('settings'))return;db.theme=b.dataset.theme;db.accent=THEMES[db.theme][0];store();render();return}
const a=b.dataset.action,ref=b.dataset.id;if(a==='next'||a==='prev'){rosterPage+=a==='next'?1:-1;render();return}if(a==='lock'){unlockUntil=0;announce('Parent Access locked.');return}if(a==='resetTheme'){if(!requireGrant('settings'))return;db.theme='Cozy Bloom';db.accent=THEMES['Cozy Bloom'][0];db.customUrl='';store();render();return}
if(a==='deleteRoutine'){if(!requireGrant('routines'))return;db.routines=db.routines.filter(r=>r.id!==ref);store();render();return}if(a==='deleteNote'){const note=db.notes.find(n=>n.id===ref);if(!note||!(may('notes')||note.author===actor()?.name))return;db.notes=db.notes.filter(n=>n.id!==ref);store();render();return}
if(a==='chooseIdea'){addGoal(IDEAS[Number(b.dataset.index)]);return}
let c=db.chores.find(c=>c.id===ref),g=db.goals.find(g=>g.id===ref);
if(['choreStart','choreSubmit','choreApprove','choreRedo'].includes(a)&&c){if(a==='choreStart'||a==='choreSubmit'){if(c.member!==activeId)return;c.status=a==='choreStart'?'started':'pending'}else{if(!requireGrant('approve'))return;c.status=a==='choreApprove'?'approved':'redo'}store();render();return}
if(['goalSubmit','goalApprove','goalRedo'].includes(a)&&g){if(a==='goalSubmit'){if(g.member!==activeId)return;g.status='pending'}else{if(!requireGrant('approve'))return;g.status=a==='goalApprove'?'approved':'redo'}store();render()}}
function addGoal(name){let d=dateTime().day;if(!String(name||'').trim())return;db.goals.push({id:id(),member:activeId,day:d,name:String(name).slice(0,100),status:'selected'});store();render()}
function uuidOk(v){return !v||/^[\da-f]{8}(-[\da-f]{4}){3}-[\da-f]{12}$/i.test(v)}
async function handleSubmit(e){e.preventDefault();const f=e.target,fd=new FormData(f),val=k=>String(fd.get(k)||'').trim();let parentProfile=actor();
if(f.id==='supabaseSignIn'||f.id==='supabaseSignUp'){
  if(authInFlight)return;
  const email=val('email').toLowerCase(),password=String(fd.get('password')||'');
  if(f.id==='supabaseSignUp'&&password.length<8){announce('Use a password at least eight characters long.');return}
  authInFlight=true;
  try{
    if(f.id==='supabaseSignIn'){
      await signInToSupabase(email,password);
      announce('Signed in to Supabase! This account has NOT been assigned a KinKeep Parent role yet.');
    }else{
      const response=await authRequest('/signup',{method:'POST',body:{email,password}});
      if(response.access_token){
        await signInToSupabase(email,password);
        announce('Supabase account created and signed in. Parent authorization is not yet connected.');
      }else{
        announce('If this email is eligible for signup, Supabase has sent confirmation instructions. Check your inbox, confirm your email, and return to sign in.');
      }
    }
  }catch(error){announce('Supabase: '+error.message)}finally{authInFlight=false}
  return;
}

if(f.id==='setPin'){if(!isParent())return;let pin=val('pin');if(pin!==val('confirm')){announce('The PINs do not match.');return}if(!/^\d{4,8}$/.test(pin)){announce('PIN must be 4 to 8 digits.');return}try{db.pinSalt=crypto.randomUUID();db.pinHash=await pinDigest(db.pinSalt+'|'+pin);unlockUntil=Date.now()+300000;store();announce('Demo PIN created. Parent Access unlocked for five minutes.')}catch(err){announce(err.message)}return}
if(f.id==='unlockPin'){if(!isParent())return;if(Date.now()<triesAt){announce('Too many attempts. Wait one minute.');return}try{let candidate=await pinDigest(db.pinSalt+'|'+val('pin'));if(candidate===db.pinHash){attempts=0;unlockUntil=Date.now()+300000;announce('Parent Access unlocked for five minutes.')}else{attempts++;if(attempts>=5){triesAt=Date.now()+60000;attempts=0}announce('Incorrect PIN.')}}catch(err){announce(err.message)}return}
if(f.id==='newMember'){if(!requireGrant('members'))return;let uuid=val('uuid');if(!uuidOk(uuid)){announce('Please enter a valid SL UUID or leave it blank.');return}db.members.push({id:id(),name:val('name'),role:val('role'),customRole:val('customRole'),emoji:val('emoji'),uuid,permissions:[]});store();announce('Member added. No extra permissions were granted.');return}
if(f.id==='editMember'){if(!requireGrant('members'))return;let m=byId(f.dataset.member);if(!m)return;let uuid=val('uuid');if(!uuidOk(uuid)){announce('Invalid avatar UUID.');return}if(m.role==='Parent'&&val('role')!=='Parent'&&db.members.filter(x=>x.role==='Parent').length===1){announce('A household must keep at least one Parent.');return}m.name=val('name');m.role=val('role');m.customRole=val('customRole');m.emoji=val('emoji');m.uuid=uuid;m.permissions=fd.getAll('grant').filter(x=>GRANTS.includes(x));if(m.role==='Parent'){m.permissions=[]}store();announce('Member profile and demo permissions updated.');return}
if(f.id==='assign'){if(!requireGrant('assign'))return;let ids=fd.getAll('who');if(!ids.length){announce('Select at least one recipient.');return}for(const who of ids){if(!byId(who))continue;db.chores.push({id:id(),member:who,name:val('name'),details:val('details'),due:val('due'),points:Math.min(9999,Math.max(0,Number(fd.get('points'))||0)),status:'todo'})}store();page='chores';announce('Assigned separate chores to '+ids.length+' member(s).');return}
if(f.id==='customGoal'){addGoal(val('name'));return}
if(f.id==='goalRules'){if(!requireGrant('goals'))return;for(const m of db.members.filter(x=>['Youth','Teen'].includes(x.role)))db.goalRequirements[m.id]=Math.max(0,Math.min(12,Number(fd.get('require-'+m.id))||0));store();announce('Daily goal requirements saved.');return}
if(f.id==='addRoutine'){if(!requireGrant('routines'))return;db.routines.push({id:id(),member:val('member'),label:val('label'),time:val('time'),days:val('days'),enabled:true});store();page='routines';announce('Reminder schedule saved for the future LSL integration (not an active alarm).');return}
if(f.id==='noteForm'){db.notes.push({id:id(),author:parentProfile?.name||'Guest',to:val('to'),text:val('text')});store();announce('Note posted in this browser.');return}
if(f.id==='appearance'){if(!requireGrant('settings'))return;db.family=val('family')||'Our Household';db.accent=val('accent');db.customUrl=val('customUrl');db.wallpaperUUID=val('wallpaperUUID');if(db.customUrl)db.theme='Custom URL';store();announce('Appearance saved locally.');return}}
document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{handleSubmit(e).catch(err=>announce('An unexpected error occurred: '+err.message))});
document.addEventListener('change',e=>{if(e.target.id==='actor'){activeId=e.target.value;unlockUntil=0;message='Switched demo profile; elevated access locked.';page='home';render()}if(e.target.id==='selfEmoji'){let m=byId(e.target.dataset.target);if(m&&m.id===activeId){m.emoji=e.target.value;store();render()}}});
render();setInterval(updateClock,30000);
</script></body></html>
